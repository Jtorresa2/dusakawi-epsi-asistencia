# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Node/Express (backend) + React 19/Vite (frontend) + PostgreSQL
  Architecture: Monorepo (pnpm workspaces), feature-based frontend, controller-service backend
  Testing: No test runner configured; testing-library deps present but no vitest/jest/playwright
  Style: ESLite/ESLint (implied), Prettier (implied)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "cd frontend && pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas